volumes:
  db:
services:
  bronson-db:
    image: docker.io/library/postgres:16.9
    container_name: bronson-db
    ports:
      - "65432:5432"
    networks:
      - bronson_net
    volumes:
      - db:/var/lib/postgresql/data
    env_file:
      - .env
  bronson_online:
    image: ghcr.io/bronsonautoreport/bronson_online_image:latest
    container_name: bronson_online
    restart: on-failure
    depends_on:
      - bronson-db
    env_file:
      - .env
    build: .
    ports:
      - "7878:7878"
    networks:
      - bronson_net
    command: cargo run --profile release -- -p
networks:
  bronson_net:
    driver: "bridge"